name: cachyos-stable-release

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: cachyos-stable
  cancel-in-progress: false

jobs:
  bump:
    name: bump fork to latest 6.18.y
    runs-on: ubuntu-latest
    env:
      FORK_REPO: adithyagenie/linux
      BASE_BRANCH: 6.18/base
      STABLE_GITHUB: https://github.com/gregkh/linux.git
      STABLE_KERNELORG: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

    steps:
      - name: latest upstream v6.18.y version
        id: latest
        run: |
          set -euo pipefail
          STABLE_GITHUB="${STABLE_GITHUB:-https://github.com/gregkh/linux.git}"
          STABLE_KO="${STABLE_KERNELORG:-https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git}"
          pairs=$(git ls-remote --tags "$STABLE_GITHUB" 'v6.18.*^{}' 'v6.18.*' 2>/dev/null \
               || git ls-remote --tags "$STABLE_KO"      'v6.18.*^{}' 'v6.18.*' 2>/dev/null)
          best=$(printf '%s\n' "$pairs" \
            | awk '/\^\{\}$/ && $2 !~ /-rc/ { sub(/\^\{\}$/,"",$2); print $2 "\t" $1 }' \
            | sed 's|refs/tags/v||' \
            | sort -V \
            | tail -n1)
          if [ -z "$best" ]; then
            best=$(printf '%s\n' "$pairs" \
              | awk '!/\^\{\}$/ && $2 !~ /-rc/ { print $2 "\t" $1 }' \
              | sed 's|refs/tags/v||' \
              | sort -V | tail -n1)
          fi
          [ -n "$best" ] || { echo "no upstream v6.18.x tag found" >&2; exit 1; }
          tag_v=${best%%$'\t'*}
          sha=${best##*$'\t'}
          echo "upstream_tag=v${tag_v}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${tag_v}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${sha}" >> "$GITHUB_OUTPUT"
          printf '› upstream latest: v%s @ %s\n' "${tag_v}" "${sha:0:12}"

      - name: decide if a bump is needed (idempotency)
        id: check
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          FORK_REPO: ${{ env.FORK_REPO }}
        run: |
          set -euo pipefail
          UPSTREAM_VERSION="${UPSTREAM_VERSION:?}"
          FORK_REPO="${FORK_REPO:?}"
          NEW_RELEASE="cachyos-$UPSTREAM_VERSION-1"
          if git ls-remote --exit-code "https://github.com/$FORK_REPO" "refs/tags/$NEW_RELEASE" >/dev/null 2>&1; then
            raise="false"; reason="tag $NEW_RELEASE already exists"
          else
            raise="true"; reason="upstream ahead ($UPSTREAM_VERSION not yet released)"
          fi
          prev_release_tag=$(git ls-remote "https://github.com/$FORK_REPO" 'refs/tags/cachyos-6.18.*-1' \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -n1 || true)
          [ -n "$prev_release_tag" ] || { echo "can't determine previous release"; exit 1; }
          echo "raise=$raise" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "previous_release_tag=$prev_release_tag" >> "$GITHUB_OUTPUT"
          echo "new_release_tag=$NEW_RELEASE" >> "$GITHUB_OUTPUT"
          printf '› check: %s\n' "$reason"

      - name: Checkout fork base (full history)
        if: ${{ steps.check.outputs.raise == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release tags
        if: ${{ steps.check.outputs.raise == 'true' }}
        run: |
          git fetch --prune --no-tags origin \
            '+refs/tags/cachyos-6.18.*-1:refs/tags/cachyos-6.18.*-1'
          echo "remote cachyos tags: $(git tag -l 'cachyos-6.18.*-1' | wc -l)"
          echo "$(git tag -l 'cachyos-6.18.*-1' | sort -V)"

      - name: git configuration (anonymous, no inherited signing)
        if: ${{ steps.check.outputs.raise == 'true' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "GitHub Actions"
          git config commit.gpgsign false
          git config tag.gpgsign false

      - name: merge upstream into base
        id: merge
        if: ${{ steps.check.outputs.raise == 'true' }}
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ steps.latest.outputs.upstream_commit }}
        run: bash .github/scripts/stable-release/03_merge.sh
      - name: tag the merge
        id: tag
        if: ${{ steps.check.outputs.raise == 'true' && steps.merge.outputs.merged == 'true' }}
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          PREVIOUS_RELEASE_TAG: ${{ steps.check.outputs.previous_release_tag }}
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
        run: bash .github/scripts/stable-release/04_tag.sh

      - name: push tag + branch
        id: push
        if: ${{ steps.check.outputs.raise == 'true' && steps.merge.outputs.merged == 'true' }}
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
        run: bash .github/scripts/stable-release/05_push.sh


      - name: build tarball + SRI hash
        id: asset
        if: ${{ steps.check.outputs.raise == 'true' && steps.merge.outputs.merged == 'true' }}
        env:
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
        run: bash .github/scripts/stable-release/06_asset.sh

      - name: generate CachyOS-style release notes
        id: changelog
        if: ${{ steps.check.outputs.raise == 'true' && steps.merge.outputs.merged == 'true' && steps.push.outcome == 'success' }}
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ steps.latest.outputs.upstream_commit }}
          PREVIOUS_RELEASE_TAG: ${{ steps.check.outputs.previous_release_tag }}
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
          FORK_REPO: ${{ env.FORK_REPO }}
        run: bash .github/scripts/stable-release/07_changelog.sh

      - id: release
        name: create / update GitHub Release + upload tarball
        if: ${{ steps.check.outputs.raise == 'true' && steps.merge.outputs.merged == 'true' && steps.push.outcome == 'success' }}
        env:
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
          TARBALL: ${{ steps.asset.outputs.tar }}
          ASSET_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: bash .github/scripts/stable-release/08_release.sh

      - name: notify telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FORK_REPO: ${{ env.FORK_REPO }}
          UPSTREAM_VERSION: ${{ steps.latest.outputs.upstream_version }}
          PREVIOUS_RELEASE_TAG: ${{ steps.check.outputs.previous_release_tag }}
          NEW_RELEASE_TAG: ${{ steps.check.outputs.new_release_tag }}
          MERGED: ${{ steps.merge.outputs.merged }}
          MERGE_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          MERGE_LOG: ${{ steps.merge.outputs.log_file }}
          RAISE: ${{ steps.check.outputs.raise }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          bash .github/scripts/stable-release/09_notify.sh \
            || printf 'warning: telegram notification failed (rc = %s)\n' "$?"
